# Papers shown on the Research page (_pages/research.md).
#
# To add a paper, add an entry to the relevant section. Only `title` is
# required; the other fields are optional:
#   url           — SSRN link for working papers; title link for other entries
#   coauthors     — list of names; the page renders it as "with A, B, and C".
#                   Names with an entry in _data/coauthors.yml become links.
#   status        — short badge text, e.g. "Submitted", "R&R at JF"
#   jmp           — true to render the highlighted Job Market Paper box
#   award         — prize or award text
#   pdf           — hosted PDF path, e.g. /assets/papers/paper-name.pdf
#   video         — YouTube link; the Video button plays it on the page
#   abstract      — text (Markdown supported), shown by the Abstract button
#   summary       — text (Markdown supported), shown by the Summary button
#   presentations — semicolon-separated list, shown in its own dropdown
# Empty working-paper fields hide the corresponding control.

working_papers:
  - title: "Taming Black Swans: Disaster Risk and the Neutral Rate of Interest"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6240078"
    pdf: "/assets/papers/chris_jmp.pdf"
    video: "https://www.youtube.com/watch?v=XhaBE8SzwFM"
    abstract: ""
    jmp: true
    award: "Winner of the Princeton Macro, Money, and International Finance Young Researcher Award"
    summary: >-
      I develop and estimate a nonlinear New Keynesian model in which higher
      disaster risk lowers asset prices and spending, reducing the risk-adjusted
      neutral rate before any disaster occurs. Evidence from option prices
      supports interpreting disaster-risk shocks as negative demand shocks.
      The estimates imply that monetary policy can remain contractionary even
      as rates are cut if the neutral rate falls faster.
    presentations: >-
      LSE Macro PhD Workshop; Macro, Money and International Finance
      Conference; St Andrews Workshop in Macroeconomics; PSE-CEPR Policy
      Forum; Central Bank Research Association (CEBRA) Annual Meeting;
      Cambridge Macro and Development PhD Conference; Saïd Business School
      Seminar; Oxford Economics Brownbag Seminar;
      <a href="https://events.bank.gov.ua/MPEM2026/">National Bank of Ukraine
      Workshop on Monetary Policy in Emerging Markets (2026)</a>; Econometric Society European
      Winter Meeting (2026, forthcoming)

  - title: "Our Deficit, Your Problem? Fiscal Sustainability, Exchange Rates, and Inflation"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5395444"
    pdf: "/assets/papers/Our_Deficit__Your_Problem.pdf"
    abstract: ""
    coauthors: ["Tobias Kawalec"]
    status: "Submitted"
    summary: >-
      We study how U.S. fiscal deficits transmit to U.K. borrowing costs and
      inflation through exchange rates and sovereign bond markets. A two-country
      model explains this fiscal contagion and shows how the monetary–fiscal
      policy mix determines the foreign response. Estimated on U.S. and U.K.
      data, the model attributes about a quarter of the 2021–2023 surge in U.K.
      producer-price inflation to U.S. fiscal shocks.
    presentations: >-
      Austrian National Bank; University of Konstanz; LSE Macro PhD Workshop;
      Macro, Money and International Finance Conference; Econometric Society
      North American Summer Meeting; GRAPE; Econometric Society European
      Meeting; German Economic Association (VfS) Annual Conference; 6th
      Oxford/Federal Reserve Bank of New York/Bank of England Monetary
      Economics Conference; CEPR European Economic Policy RPN; 28th Macro
      Finance Society Workshop (poster session)

  - title: "Pricing the Left Tail: Consumption Skewness and Expected Returns"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6662140"
    pdf: "/assets/papers/consumption_risk.pdf"
    abstract: ""
    coauthors: ["Niklas Schmitz"]
    status: "Submitted"
    summary: >-
      We estimate the conditional distribution of future U.S. consumption
      growth using quantile regressions and machine learning. Greater downside
      risk, measured by lower Kelley skewness, predicts higher excess equity
      returns and is priced in the cross section, while variance and dispersion
      have no comparable predictive power. Monetary easing is associated with
      lower downside risk when that risk is already high.
    presentations: >-
      University of Oxford Internal Seminar

  - title: "A Macro-Finance Model of Credit Spreads"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5313973"
    pdf: "/assets/papers/A_Macro_Finance_Model_of_Credit_Spreads.pdf"
    abstract: ""
    coauthors: ["Theofanis Papamichalis", "Dimitrios P. Tsomocos", "Nikolaos Romanidis"]
    status: "Submitted"
    summary: >-
      We develop a continuous-time macro-finance model in which scarce
      intermediary capital raises the excess bond premium, the part of
      corporate spreads unexplained by firm-level default risk. The model
      reproduces the premium's rise in recessions and shows how default can
      recapitalize intermediaries and expand credit. Its welfare analysis
      favors lenient default penalties and tighter leverage limits when
      intermediary capital is scarce.
    presentations: >-
      SAET 2025; Cowles Foundation 20th Annual Conference on General
      Equilibrium and its Applications; SAET-EWET 2026; Mathematics in
      Finance 2026

  - title: "Supplying Safety to an Aging World: Demographics, Debt, and Risk Premia"
    url: "https://papers.ssrn.com/abstract=7570178"
    pdf: "/assets/papers/demographics.pdf"
    abstract: ""
    coauthors: ["Tim Willems"]
    summary: >-
      We show that demographic aging increases demand for safe bonds and
      reduces households' capacity to bear equity risk, lowering safe interest
      rates and raising equity premia. In a two-country model where aging is
      more pronounced abroad, the relatively younger U.S. supplies safe assets
      and takes leveraged equity positions, leading to a larger rise in its
      equity premium.

  - title: "How to Shrink a Central Bank: The Optimal Pace of Quantitative Tightening"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7207778"
    pdf: "/assets/papers/shrink_central_bank.pdf"
    abstract: ""
    coauthors: ["Seung Joo Lee"]
    summary: >-
      We solve for the optimal reserve-drainage path and completion date of
      quantitative tightening. Reserve scarcity and rapid drainage tighten
      financial conditions through distinct channels, so announcements affect
      demand before reserves change. Without output stabilization, optimal
      drainage starts quickly and tapers. Stabilization can shorten the
      transition when prolonged scarcity is costly, or lengthen it when
      payment-flow strains dominate.

  - title: "The Inequality Multiplier: Portfolio Allocation Frictions and Wealth Inequality"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5310388"
    pdf: "/assets/papers/The_Inequality_Multiplier.pdf"
    abstract: ""
    coauthors: ["Aditya Khemka"]
    status: "Submitted"
    award: "Winner of Best Doctoral Paper at Saïd Business School, 2024"
    summary: >-
      We study how portfolio allocation frictions link equity revaluation to
      household lending and wealth concentration. Restrictions on intermediaries'
      substitution between equity and debt amplify the effects of asset demand
      on inequality in a model calibrated to the U.S. economy. Even with identical
      equity price paths, these frictions generate a cumulative response of the
      top wealth share about one third larger than with flexible portfolios,
      through additional lending.
    presentations: >-
      Bank of England Macro Brown Bag; Asian Finance Association, Taipei;
      Trans-Atlantic Doctoral Conference, London Business School; Rethinking
      Economic Theory Conference, Athens; ISB Summer Research; European
      Economic Association Annual Congress

publications:
  - title: "Multilayer Networks For Text Analysis With Multiple Data Types"
    url: "https://epjdatascience.springeropen.com/articles/10.1140/epjds/s13688-021-00288-5"
    coauthors: ["Yuanming Tao", "Lamiae Azizi", "Martin Gerlach", "Tiago P. Peixoto", "Eduardo G. Altmann"]
    venue: "EPJ Data Science, 2021"
    award: "Winner of Best Thesis at University of Sydney Mathematics Department"
    abstract: >-
      We propose a multilayer network framework using stochastic block models
      to jointly analyze text, metadata, and hyperlinks within a unified
      probabilistic structure. The approach improves topic detection and link
      prediction across diverse large-scale document datasets.

